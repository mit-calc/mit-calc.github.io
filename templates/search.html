<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chasing Compute - Foundation Model Research</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <!-- Navigation Bar -->
    <header class="site-header">
        <nav class="main-nav">
            <div class="logo">
                <h1>Chasing Compute</h1>
            </div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="{{ url_for('index_page') }}#research">Research</a></li>
                <li><a href="{{ url_for('index_page') }}#discussion">Discussion</a></li>
                <li><a href="{{ url_for('search_page') }}">Check Your Info</a></li>
            </ul>
        </nav>
    </header>

    <!-- Static HTML -->
    <main>
        <section id="search" class="search-section">
            <div class="split-container">
                <div class="left-panel">
                    <h2>Find Your Research Papers</h2>
                    <p>Enter your name to see which papers you've contributed to:</p>

                    <!-- User puts in their name here. -->
                    <form id="searchForm">
                        <input type="text" id="nameInput" placeholder="Enter your name">
                        <button type="submit" id="submitName">Search</button>
                    </form>

                    <!-- Display a list of papers associated with user. -->
                    <div id="paper-list"></div>
                </div>

                <div class="right-panel">
                    <h2>Paper Details</h2>
                    <!-- After clicking on a paper title, its info shows up here. -->
                    <div id="paper-details"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- JavaScript -->
    <script>
        let currentPaperIndex = null;

        const form = document.getElementById('searchForm');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            lookup();
        });

        let properUserName = '';  // User's name (capitalized properly, for data-saving purposes)

        // User submits name -> Look for associated papers
        async function lookup() {
            const name = document.getElementById('nameInput').value.trim();
            const leftDiv = document.getElementById('paper-list');  // Left side panel
            const rightDiv = document.getElementById('paper-details');  // Right side panel

            leftDiv.innerHTML = "Searching...";
            rightDiv.innerHTML = `<p>Click on a paper from the list to view its details.</p>`;

            const response = await fetch('/query', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name})
            });

            const data = await response.json();

            if (data.name) {
                properUserName = data.name;
            }

            if (data.error) {
                leftDiv.innerHTML = `<p class="error">${data.error}</p>`;
                return;
            }

            if (data.papers.length === 0) {
                leftDiv.innerHTML = `<p>No papers found for <b>${name}</b>.</p>`;
                return;
            }

            // Update left panel.
            const list = data.papers
                .map(p => `<li data-index="${p.index}" onclick="showDetails(${p.index})">${p.title}</li>`)
                .join('');
            leftDiv.innerHTML = `
                <h3>Papers with ${properUserName}</h3>
                <ul>${list}</ul>
            `;
        }

        // "No GPUs Used" Button
        function toggleNoGPUs() {
            const btn = document.getElementById('no-gpus-btn');
            const isActive = btn.classList.contains('active');
            
            if (isActive) {
                document.querySelectorAll('.gpu-input').forEach(input => {
                    input.disabled = false;
                    input.style.backgroundColor = '';
                });
                btn.textContent = 'No GPUs Used';
                btn.classList.remove('active');
            } else {
                document.querySelectorAll('.gpu-input').forEach(input => {
                    input.value = '';
                    input.disabled = true;
                    input.style.backgroundColor = '#f5f5f5';
                });
                btn.textContent = 'No GPUs Used ✓';
                btn.classList.add('active');
            }
        }

        let gpuChecked = false;
        let llmChecked = false;
        let fundingChecked = false;

        function confirmGPUSection() {
            const btn = document.getElementById('confirm-gpu-btn');
            gpuChecked = !gpuChecked;
            
            if (gpuChecked) {
                btn.textContent = 'GPU Info Verified ✓';
                btn.classList.add('confirmed');
            } else {
                btn.textContent = 'I checked that all information I wrote in this section is correct';
                btn.classList.remove('confirmed');
            }
        }

        function confirmLLMSection() {
            const btn = document.getElementById('confirm-llm-btn');
            llmChecked = !llmChecked;
            
            if (llmChecked) {
                btn.textContent = 'LLM Info Verified ✓';
                btn.classList.add('confirmed');
            } else {
                btn.textContent = 'I checked that all information I wrote in this section is correct';
                btn.classList.remove('confirmed');
            }
        }

        function confirmFundingSection() {
            const btn = document.getElementById('confirm-funding-btn');
            fundingChecked = !fundingChecked;
            
            if (fundingChecked) {
                btn.textContent = 'Funding Info Verified ✓';
                btn.classList.add('confirmed');
            } else {
                btn.textContent = 'I checked that all information I wrote in this section is correct';
                btn.classList.remove('confirmed');
            }
        }

        // User clicks on paper title -> Display paper's info on right side
        async function showDetails(index){
            // Resets the section check buttons
            gpuChecked = false;
            llmChecked = false;
            fundingChecked = false;

            currentPaperIndex = index;

            const detailsDiv = document.getElementById('paper-details');
            detailsDiv.innerHTML = "<p>Loading...</p>";

            const response = await fetch('/paper_details', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({index})
            });

            const data = await response.json();

            detailsDiv.innerHTML = `
                <h3>Basic Info</h3>
                <div class="field"><h4>Title</h4><p class="value">${data["Title"] || "N/A"}</p></div>
                <div class="field"><h4>Authors</h4><p class="value">${data["Authors"] || "N/A"}</p></div>
                <div class="field"><h4>Year</h4><p class="value">${data["Year"] || "N/A"}</p></div>
                
                <h3>Eligibility Criteria</h3>
                <div class="eligibility-box">
                    <p><b>READ BEFORE SUBMITTING!</b> Please confirm your paper meets ALL of the following criteria:</p>
                    <ul>
                        <li>You are the first author or co-first author of this paper.</li>
                        <li>The project is completed.</li>
                        <li>The project works with Large Language Models (LLM) ONLY.</li>
                        <li>This work is primarily in the CS domain.</li>
                        <li>This work is NOT a survey paper.</li>
                        <li>You made sure that the information you entered is accurate. We will check the quality of your answers before sending any compensation.</li>
                    </ul>
                    <p><b>You can only submit revised information for a maximum of five papers. All inputs are optional, 
                        so only submit information that you know is correct.</b></p>
                    <label class="eligibility-confirm">
                        <input type="checkbox" id="eligibility-checkbox">
                        <span>I confirm this paper meets all eligibility criteria above</span>
                    </label>
                </div>
            `;

            const gpuTypes = [
                "NVIDIA Tesla V100",
                "NVIDIA Tesla A100",
                "NVIDIA Tesla P100",
                "NVIDIA Tesla A40",
                "NVIDIA Tesla A800",
                "NVIDIA Tesla A4000",
                "NVIDIA Tesla A5000",
                "NVIDIA Tesla H100",
                "NVIDIA Tesla A6000",
                "Nvidia GeForce RTX 3090",
                "Nvidia GeForce RTX 4090",
                "Others"
            ];

            // GPU Info as table
            
            let gpuTableHTML = `
                <h3>GPU Info</h3>
                <button id="no-gpus-btn" class="no-gpus-button" onclick="toggleNoGPUs()">No GPUs Used</button>
                <table class="gpu-info-table">
                    <thead>
                        <tr>
                            <th>GPU Type</th>
                            <th>GPU Number</th>
                            <th>GPU Storage</th>
                            <th>Inference Time</th>
                        </tr>
                    </thead>
                    <tbody>`;

            gpuTypes.forEach(gpuType => {
                gpuTableHTML += `
                    <tr>
                        <td>${gpuType}</td>
                        <td><input type="text" class="gpu-input" data-gpu-type="${gpuType}" data-field="GPU Number" placeholder=""></td>
                        <td><input type="text" class="gpu-input" data-gpu-type="${gpuType}" data-field="GPU Storage" placeholder=""></td>
                        <td><input type="text" class="gpu-input" data-gpu-type="${gpuType}" data-field="Inference Time" placeholder=""></td>
                    </tr>
                `;
            });

            gpuTableHTML += `
                    </tbody>
                </table>
            `;

            detailsDiv.innerHTML += gpuTableHTML;

            detailsDiv.innerHTML += `
                <button id="confirm-gpu-btn" class="confirm-section-btn" onclick="confirmGPUSection()">
                    I checked that all information I wrote in this section is correct.
                </button>
            `;

            const sections = [
                {
                    heading: "LLM Info",
                    fields: ["LLM(s) FineTuning", "LLM(s) Evaluation"]
                },
                {
                    heading: "Funding Info",
                    fields: ["API Cost", "Funding Resource"]
                }
            ];

            function createFieldHTML(label, value) {
                return `
                    <div class="field">
                        <span class="label"><b>${label}:</b></span>
                        <span class="value">${value}</span>
                        <br>
                        <input type="text" class="correction" placeholder="Correct this value if wrong">
                    </div>
                `;
            }

        function displayPaperInfo(data) {
            const detailsDiv = document.getElementById('paper-details');
            let html = "";

            // Display the sections: LLM Info, Funding Info
            sections.forEach(section => {
                html += `<h3>${section.heading}</h3>`;
                section.fields.forEach(field => {
                    const value = data[field] || "N/A";
                    html += createFieldHTML(field, value);
                });
                
                // Add Funding Type dropdown after Funding Info section
                if (section.heading === "Funding Info") {
                    html += `
                        <div class="field">
                            <span class="label"><b>Funding Type:</b></span>
                            <span class="value">${data["Funding Type"] || "N/A"}</span>
                            <br>
                            <select class="correction funding-dropdown">
                                <option value="">Select funding type...</option>
                                <option value="Corporate">Corporate</option>
                                <option value="Government">Government</option>
                                <option value="Foundation">Foundation</option>
                                <option value="Others">Others</option>
                            </select>
                        </div>
                    `;
                }

                if (section.heading === "LLM Info") {
                    html += `
                        <button id="confirm-llm-btn" class="confirm-section-btn" onclick="confirmLLMSection()">
                            I checked that all information I wrote in this section is correct
                        </button>
                    `;
                }
                
                if (section.heading === "Funding Info") {
                    html += `
                        <button id="confirm-funding-btn" class="confirm-section-btn" onclick="confirmFundingSection()">
                            I checked that all information I wrote in this section is correct
                        </button>
                    `;
                }
            });

            // Additional Comments box
            html += `
                <h3>Additional Comments</h3>
                <div class="field">
                    <textarea 
                        id="additional-comments" 
                        class="comment-box" 
                        placeholder="Share any additional comments below..."
                    ></textarea>
                </div>
            `;

            detailsDiv.innerHTML += html;
        }
            displayPaperInfo(data);

            const existingButton = document.getElementById('submitCorrections');
            if (!existingButton) {
                const submitButton = document.createElement('button');
                submitButton.id = 'submitCorrections';
                submitButton.textContent = 'Submit Corrections';
                detailsDiv.appendChild(submitButton);

                submitButton.addEventListener('click', () => {
                    submitCorrections();
                });
            }
        }
        
        const submitButton = document.getElementById('submitCorrections');

        // Press "Submit Corrections" -> Saves corrected data
        async function submitCorrections() {
            // Check eligibility first
            const eligibilityChecked = document.getElementById('eligibility-checkbox');
            if (!eligibilityChecked || !eligibilityChecked.checked) {
                alert("Please confirm the paper meets all eligibility criteria before submitting.");
                return;
            }
            
            const corrections = {};
            
            // Add confirmation flags
            corrections["GPU CHECKED"] = gpuChecked ? "Checked" : "N/A";
            corrections["LLM CHECKED"] = llmChecked ? "Checked" : "N/A";
            corrections["Funding CHECKED"] = fundingChecked ? "Checked" : "N/A";

            // Check if "No GPUs Used" is active
            const noGpusBtn = document.getElementById('no-gpus-btn');
            
            const noGpusUsed = noGpusBtn && noGpusBtn.classList.contains('active');

            if (noGpusUsed) {
                corrections["GPU Number"] = "0";
                corrections["GPU Type"] = "None";
                corrections["GPU Storage"] = "0";
            } else {
                // Handle GPU table inputs - create separate entries for each GPU type with data
                const gpuInputs = document.querySelectorAll('.gpu-input');
                const gpuDataByType = {};
                
                gpuInputs.forEach(input => {
                    if (input.value.trim()) {
                        const gpuType = input.dataset.gpuType;
                        const field = input.dataset.field;
                        
                        if (!gpuDataByType[gpuType]) {
                            gpuDataByType[gpuType] = {};
                        }
                        gpuDataByType[gpuType][field] = input.value.trim();
                    }
                });
                
                // Add GPU data to corrections with indexed keys
                Object.entries(gpuDataByType).forEach(([gpuType, data], index) => {
                    corrections[`GPU Type ${index + 1}`] = gpuType;
                    if (data["GPU Number"]) corrections[`GPU Number ${index + 1}`] = data["GPU Number"];
                    if (data["GPU Storage"]) corrections[`GPU Storage ${index + 1}`] = data["GPU Storage"];
                    if (data["Inference Time"]) corrections[`Inference Time ${index + 1}`] = data["Inference Time"];
                });
            }

            // Handle other fields (LLM, Funding) - keep existing logic
            document.querySelectorAll('.field').forEach(f => {
                const input = f.querySelector('.correction');
                if (input && input.value.trim() !== "") {
                    const labelEl = f.querySelector('.label');
                    const fieldName = labelEl ? labelEl.textContent.replace(":", "").trim() : null;
                    if (fieldName) {
                        corrections[fieldName] = input.value.trim();
                    }
                }
            });

            corrections["Share any additional comments below:"] =
            document.getElementById('additional-comments').value.trim() || "N/A";

            const payload = { paper_index: currentPaperIndex, corrections };

            const response = await fetch('/submit_corrections', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    paper_index: currentPaperIndex,
                    corrections: corrections,
                    user_name: properUserName
                })
            });

            const data = await response.json();
            console.log("Server response:", data);
            alert("Corrections submitted!");
        }

    </script>
</body>
</html>
