<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Updates - Chasing Compute</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <header class="site-header">
        <nav class="main-nav">
            <div class="logo">
                <h1>Chasing Compute</h1>
            </div>
            <ul class="nav-links">
                <li><a href="{{ url_for('index_page') }}">Home</a></li>
                <li><a href="{{ url_for('index_page') }}#research">Research</a></li>
                <li><a href="{{ url_for('index_page') }}#discussion">Discussion</a></li>
                <li><a href="{{ url_for('search_page') }}">Check Your Info</a></li>
                <li><a href="{{ url_for('community_page') }}">Community</a></li>
            </ul>
        </nav>
    </header>

    <main style="padding-top: 100px;">
        <div class="community-split-container">
            <div class="community-left-panel">
                <h1>All Papers</h1>
                <div class="community-search-filters">
                    <input type="text" id="author-search" class="community-search-input" placeholder="Search by author name...">
                    <input type="text" id="title-search" class="community-search-input" placeholder="Search by paper title...">
                </div>
                <div class="community-papers-scroll">
                    <div id="papers-list" class="community-loading">Loading papers...</div>
                    <div id="pagination" class="community-pagination"></div>
                </div>
            </div>
            
            <div class="community-right-panel">
                <h1>Paper Details</h1>
                <div id="paper-details" class="community-paper-details-content">
                    <p class="community-placeholder-message">Click on a paper from the list to view its details.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        let allPapers = [];
        let filteredPapers = [];
        let selectedPaperId = null;
        let currentPage = 1;
        const papersPerPage = 30;

        async function loadPapers() {
            try {
                const response = await fetch('/api/all_papers');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const papers = await response.json();
                
                if (papers.length === 0) {
                    document.getElementById('papers-list').innerHTML = '<p>No papers found.</p>';
                    return;
                }

                // Store papers and sort alphabetically by title
                allPapers = papers.sort((a, b) => 
                    a.paper_title.localeCompare(b.paper_title)
                );
                
                // Initially show all papers
                filteredPapers = [...allPapers];

                // Display first page
                displayPage(1);

            } catch (error) {
                console.error('Full error:', error);
                document.getElementById('papers-list').innerHTML = 
                    `<p>Error loading papers: ${error.message}</p>`;
            }
        }

        function filterPapers() {
            const authorQuery = document.getElementById('author-search').value.toLowerCase().trim();
            const titleQuery = document.getElementById('title-search').value.toLowerCase().trim();
            
            filteredPapers = allPapers.filter(paper => {
                const matchesAuthor = !authorQuery || 
                    paper.paper_authors.toLowerCase().includes(authorQuery);
                const matchesTitle = !titleQuery || 
                    paper.paper_title.toLowerCase().includes(titleQuery);
                
                return matchesAuthor && matchesTitle;
            });
            
            // Reset to first page when filtering
            displayPage(1);
        }

        // Add event listeners for search inputs
        document.getElementById('author-search').addEventListener('input', filterPapers);
        document.getElementById('title-search').addEventListener('input', filterPapers);

        function displayPage(pageNum) {
            currentPage = pageNum;
            
            const startIdx = (pageNum - 1) * papersPerPage;
            const endIdx = startIdx + papersPerPage;
            const pagePapers = filteredPapers.slice(startIdx, endIdx);
            
            const container = document.getElementById('papers-list');
            
            if (filteredPapers.length === 0) {
                container.innerHTML = '<p>No papers match your search criteria.</p>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            
            // Display papers for current page
            container.innerHTML = pagePapers.map((paper, index) => {
                // Format timestamp to only show date
                let displayDate = 'N/A';
                if (paper.timestamp && paper.timestamp !== 'N/A') {
                    // Extract just the date part (yyyy-mm-dd)
                    displayDate = paper.timestamp.split(' ')[0];
                }
                
                // Build category badges HTML
                let categoryBadges = '';
                if (paper.domain && paper.domain !== 'N/A') {
                    categoryBadges += `<span class="community-category-badge">${paper.domain}</span>`;
                }
                if (paper.phase && paper.phase !== 'N/A') {
                    categoryBadges += `<span class="community-category-badge">${paper.phase}</span>`;
                }
                if (paper.method && paper.method !== 'N/A') {
                    categoryBadges += `<span class="community-category-badge">${paper.method}</span>`;
                }
                
                // Build additional comments HTML
                let commentsHTML = '';
                if (paper.additional_comments && paper.additional_comments !== 'N/A' && paper.additional_comments.trim() !== '') {
                    commentsHTML = `<div class="community-additional-comments">"${paper.additional_comments}"</div>`;
                }
                
                return `
                    <div class="community-update-card" data-paper-id="${paper.paper_id}" onclick="showPaperDetails('${paper.paper_id}')">
                        <div class="community-update-header">
                            <h2>${paper.paper_title}</h2>
                            <div class="community-update-meta">
                                <span><strong>Authors:</strong> ${paper.paper_authors}</span>
                            </div>
                            ${categoryBadges ? `<div class="community-category-badges">${categoryBadges}</div>` : ''}
                        </div>
                        <hr class="community-card-divider">
                        <div class="community-modification-info">
                            <strong>Last update made by:</strong> ${paper.last_update}
                            ${displayDate !== 'N/A' ? ` on ${displayDate}` : ''}
                        </div>
                        ${commentsHTML}
                    </div>
                `;
            }).join('');
            
            // Update pagination
            displayPagination();
            
            // Scroll to top of papers list
            container.scrollTop = 0;
        }

        function displayPagination() {
            const totalPages = Math.ceil(filteredPapers.length / papersPerPage);
            const paginationContainer = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }
            
            let paginationHTML = '';
            
            // Previous button
            paginationHTML += `
                <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                    ← Previous
                </button>
            `;
            
            // Page numbers with ellipsis
            const pageNumbers = getPageNumbers(currentPage, totalPages);
            
            pageNumbers.forEach(page => {
                if (page === '...') {
                    paginationHTML += `<span class="ellipsis" onclick="goToPage(${totalPages})" title="Jump to page">...</span>`;
                } else {
                    paginationHTML += `
                        <button 
                            onclick="changePage(${page})" 
                            class="${page === currentPage ? 'active' : ''}">
                            ${page}
                        </button>
                    `;
                }
            });
            
            // Next button
            paginationHTML += `
                <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                    Next →
                </button>
            `;
            
            paginationContainer.innerHTML = paginationHTML;
        }

        function getPageNumbers(current, total) {
            const pages = [];
            
            if (total <= 7) {
                // Show all pages if 7 or fewer
                for (let i = 1; i <= total; i++) {
                    pages.push(i);
                }
            } else {
                // Always show first page
                pages.push(1);
                
                if (current > 3) {
                    pages.push('...');
                }
                
                // Show pages around current page
                for (let i = Math.max(2, current - 1); i <= Math.min(total - 1, current + 1); i++) {
                    pages.push(i);
                }
                
                if (current < total - 2) {
                    pages.push('...');
                }
                
                // Always show last page
                pages.push(total);
            }
            
            return pages;
        }

        function goToPage(totalPages) {
            const pageNum = prompt(`Enter page number (1-${totalPages}):`);
            
            if (pageNum === null) {
                return; // User cancelled
            }
            
            const page = parseInt(pageNum);
            
            if (isNaN(page) || page < 1 || page > totalPages) {
                alert(`Please enter a valid page number between 1 and ${totalPages}`);
                return;
            }
            
            changePage(page);
        }

        function changePage(pageNum) {
            const totalPages = Math.ceil(filteredPapers.length / papersPerPage);
            
            if (pageNum < 1 || pageNum > totalPages) {
                return;
            }
            
            displayPage(pageNum);
        }

        async function showPaperDetails(paperId) {
            // Remove previous selection
            document.querySelectorAll('.community-update-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // Add selection to clicked card
            const selectedCard = document.querySelector(`[data-paper-id="${paperId}"]`);
            if (selectedCard) {
                selectedCard.classList.add('selected');
            }
            
            selectedPaperId = paperId;
            
            // Show loading state
            const detailsDiv = document.getElementById('paper-details');
            detailsDiv.innerHTML = '<p class="community-loading">Loading paper details...</p>';
            
            try {
                // Fetch paper details
                const response = await fetch(`/api/paper_info/${paperId}`);
                
                if (!response.ok) {
                    throw new Error('Failed to load paper details');
                }
                
                const paperInfo = await response.json();
                
                // Helper function to create field display
                function createField(label, value) {
                    return `<div class="community-paper-field"><b>${label}:</b> ${value}</div>`;
                }
                
                // Helper function to parse value (could be string or list)
                function parseValue(value) {
                    if (typeof value === 'string') {
                        // Try to parse as array if it looks like one
                        if (value.startsWith('[') && value.endsWith(']')) {
                            try {
                                return JSON.parse(value.replace(/'/g, '"'));
                            } catch {
                                return [value];
                            }
                        }
                        // Check if it's a comma-separated list
                        if (value.includes(',')) {
                            return value.split(',').map(v => v.trim());
                        }
                        return [value];
                    }
                    return Array.isArray(value) ? value : [value];
                }
                
                // Determine badge class
                const lastUpdate = paperInfo['Last update made by'] || paperInfo['Last Update'] || 'N/A';
                const badgeClass = lastUpdate === 'ChatGPT' ? 'chatgpt' : 'user';
                
                // Build HTML sections
                let html = '';
                
                // Title and Last Update
                html += `<h2>${paperInfo['Title'] || 'N/A'}</h2>`;
                html += `<div class="community-last-update">
                    Last update made by <span class="community-update-badge ${badgeClass}">${lastUpdate}</span>
                </div>`;
                
                // Basic Info Section (without Title and Last Update)
                html += `<div class="community-paper-info-section">
                    <h3>Basic Info</h3>
                    ${createField('Authors', paperInfo['Authors'] || 'N/A')}
                    ${createField('Domain', paperInfo['Domain'] || 'N/A')}
                    ${createField('Phase', paperInfo['Phase'] || 'N/A')}
                    ${createField('Method', paperInfo['Method'] || 'N/A')}
                </div>`;
                
                // GPU Info Section with table
                html += `<div class="community-paper-info-section">
                    <h3>GPU Info</h3>`;
                
                const gpuTypes = parseValue(paperInfo['GPU Type'] || 'N/A');
                const gpuNumbers = parseValue(paperInfo['GPU Number'] || 'N/A');
                const gpuStorage = parseValue(paperInfo['GPU Storage'] || 'N/A');
                const inferenceTime = parseValue(paperInfo['Inference Time'] || 'N/A');
                
                // Check if we have valid GPU data
                if (gpuTypes[0] !== 'N/A' && gpuTypes[0] !== '') {
                    html += `<table class="community-gpu-table">
                        <thead>
                            <tr>
                                <th>GPU Type</th>
                                <th>GPU Number</th>
                                <th>GPU Storage</th>
                                <th>Inference Time</th>
                            </tr>
                        </thead>
                        <tbody>`;
                    
                    for (let i = 0; i < gpuTypes.length; i++) {
                        html += `<tr>
                            <td>${gpuTypes[i] || 'N/A'}</td>
                            <td>${gpuNumbers[i] || 'N/A'}</td>
                            <td>${gpuStorage[i] || 'N/A'}</td>
                            <td>${inferenceTime[i] || 'N/A'}</td>
                        </tr>`;
                    }
                    
                    html += `</tbody></table>`;
                } else {
                    html += createField('GPU Info', 'N/A');
                }
                
                html += `</div>`;
                
                // LLM Info Section
                html += `<div class="community-paper-info-section">
                    <h3>LLM Info</h3>
                    ${createField('LLM(s) FineTuning', paperInfo['LLM(s) FineTuning'] || 'N/A')}
                    ${createField('LLM(s) Evaluation', paperInfo['LLM(s) Evaluation'] || 'N/A')}
                </div>`;
                
                // Funding Info Section
                html += `<div class="community-paper-info-section">
                    <h3>Funding Info</h3>
                    ${createField('API Cost', paperInfo['API Cost'] || 'N/A')}
                    ${createField('Funding Resource', paperInfo['Funding Resource'] || 'N/A')}
                    ${createField('Funding Type', paperInfo['Funding Type'] || 'N/A')}
                </div>`;
                
                detailsDiv.innerHTML = html;
                
            } catch (error) {
                console.error('Error loading paper details:', error);
                detailsDiv.innerHTML = '<p class="community-placeholder-message">Error loading paper details.</p>';
            }
        }

        loadPapers();
    </script>
</body>
</html>
